# Render Blueprint for the backend API. Structure only — every `sync: false` value is set in the
# Render dashboard, never committed. Keep this list in sync with
# backend/src/common/config/env.validation.ts and backend/.env.example: the API refuses to boot
# if Joi validation fails on a missing required var. See docs/DEPLOYMENT.md.
services:
  - type: web
    name: book-selling-api
    runtime: node
    rootDir: backend
    plan: starter
    buildCommand: npm ci && npm run build
    startCommand: npm run start:prod
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: NODE_VERSION
        value: "24"
      - key: MONGODB_URI
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: BRAND_NAME
        sync: false
      - key: SUPPORT_EMAIL
        sync: false
      - key: BUSINESS_POSTAL_ADDRESS
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_WEBHOOK_SECRET
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: MAIL_REPLY_TO
        sync: false
      - key: OWNER_ALERT_EMAIL
        sync: false
