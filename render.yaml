# Render Blueprint for the backend API. Structure only — every `sync: false` value is set in the
# Render dashboard, never committed. Keep this list in sync with
# backend/src/common/config/env.validation.ts and backend/.env.example: the API refuses to boot
# if Joi validation fails on a missing required var. See docs/DEPLOYMENT.md.
services:
  - type: web
    name: book-selling-api
    runtime: node
    rootDir: backend
    plan: starter
    # --include=dev: NODE_ENV=production below would otherwise make npm skip the build tools
    # (@nestjs/cli, typescript) and migrate-mongo.
    buildCommand: npm ci --include=dev && npm run build
    # Runs after a successful build and before the new version takes traffic; a failed migration
    # stops the deploy and the previous version keeps serving (docs/DEPLOYMENT.md §7).
    preDeployCommand: npm run migrate:up
    startCommand: npm run start:prod
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: NODE_VERSION
        value: "24"
      - key: MONGODB_URI
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: BRAND_NAME
        sync: false
      - key: SUPPORT_EMAIL
        sync: false
      - key: BUSINESS_POSTAL_ADDRESS
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_WEBHOOK_SECRET
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: MAIL_REPLY_TO
        sync: false
      - key: OWNER_ALERT_EMAIL
        sync: false
      - key: JWT_ACCESS_SECRET
        sync: false
      - key: TWO_FACTOR_ENCRYPTION_KEY
        sync: false
      - key: BCRYPT_COST
        value: "12"
      # Cloudinary (docs/ARCHITECTURE.md §10.0); all three required in production
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      # One folder per environment, so staging never touches production assets
      - key: CLOUDINARY_FOLDER
        value: book-selling/production
      # Match the Cloudinary plan’s maximum upload size (MB)
      - key: MANUSCRIPT_MAX_MB
        sync: false
      - key: IMAGE_MAX_MB
        value: "15"
      # Largest share of a book the free preview may show (PRODUCT_RULES §4)
      - key: PREVIEW_MAX_PERCENT
        value: "15"
      # Same value as the storefront’s REVALIDATE_SECRET (Vercel)
      - key: FRONTEND_REVALIDATE_SECRET
        sync: false
      # Payments (docs/ARCHITECTURE.md §9). "live" takes real money: production only. Every key
      # must match the mode (the API refuses to boot otherwise). A provider whose keys are empty
      # is simply not offered.
      - key: PAYMENTS_MODE
        sync: false
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: FLUTTERWAVE_SECRET_KEY
        sync: false
      - key: FLUTTERWAVE_WEBHOOK_HASH
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
